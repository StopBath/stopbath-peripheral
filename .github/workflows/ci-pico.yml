# The Pico job (peripheral spec SE1): this device's host tests, the shared
# suites under this device's host flag set, the development peer build, and
# the firmware build against the pinned SDK and compiler, all run from
# inside pico/. Path filtered to this device and to shared/, since a change
# under flipper/ alone cannot affect the firmware.
name: pico

on:
  push:
    branches: [main]
    paths:
      - "pico/**"
      - "shared/**"
      - ".github/workflows/ci-pico.yml"
  pull_request:
    paths:
      - "pico/**"
      - "shared/**"
      - ".github/workflows/ci-pico.yml"

defaults:
  run:
    working-directory: pico

jobs:
  host-tests:
    name: host tests, shared suites under the Pico's flags, sanitiser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc --version
      - run: make test
      - run: make test-shared
      - run: make test-sanitise
      - run: make peer

  firmware-build:
    name: firmware build against the pinned SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      # The same scripts the development machine runs: the first downloads the
      # pinned compiler, verifies Arm's digest, and clones the pinned SDK.
      # Invoked through bash because the repository is edited on Windows, where
      # git records no executable bit.
      - run: bash scripts/setup_toolchain.sh
      - run: bash scripts/build_firmware.sh
      # Peripheral spec SE3: the image's link map names no symbol and no
      # object from shared/tests/, shared/fuzz/ or shared/peer/.
      - run: python3 ../shared/scripts/check_link_map.py build/firmware/stopbath_pico.elf.map build/firmware/stopbath_pico_first_light.elf.map build/firmware/stopbath_pico_layout_demo.elf.map
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: pico/dist/*.uf2
