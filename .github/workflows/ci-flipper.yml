# The Flipper job (peripheral spec SE1): this device's host tests, the
# shared suites under this device's host flag set, the development peer
# build, and the application build against the pinned SDK, all run from
# inside flipper/. Path filtered to this device and to shared/, since a
# change under pico/ alone cannot affect the FAP.
name: flipper

on:
  push:
    branches: [main]
    paths:
      - "flipper/**"
      - "shared/**"
      - ".github/workflows/ci-flipper.yml"
  pull_request:
    paths:
      - "flipper/**"
      - "shared/**"
      - ".github/workflows/ci-flipper.yml"

# The one place the SDK is pinned for continuous integration. The same URL is
# recorded in flipper/README.md for the development machine.
env:
  UNLEASHED_SDK_URL: https://github.com/DarkFlippers/unleashed-firmware/releases/download/unlshd-086/flipper-z-f7-sdk-unlshd-086.zip
  UFBT_VERSION: 0.2.6

defaults:
  run:
    working-directory: flipper

jobs:
  host-tests:
    name: host tests, shared suites under the Flipper's flags, sanitiser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc --version
      - run: make test
      - run: make test-shared
      - run: make test-sanitise
      - run: make peer

  application-build:
    name: application build against the pinned SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "ufbt==${UFBT_VERSION}"
      - run: ufbt update --hw-target f7 --url "${UNLEASHED_SDK_URL}"
      - run: ufbt
      - run: ls -l dist/stopbath_remote.fap
      # Peripheral spec SE4: the application's link map names no symbol, no
      # object and no archive member from shared/tests/, fuzz/ or peer/.
      - run: python3 ../shared/scripts/check_link_map.py .ufbt/build/stopbath_remote_d.elf.map
      - uses: actions/upload-artifact@v4
        with:
          name: stopbath_remote.fap
          path: flipper/dist/stopbath_remote.fap
